name: task-b manual

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message shown on the web page'
        required: true
        default: 'Hello CI/CD'
      tag:
        description: 'Docker image tag'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace message in index.html
        run: sed -i "s#DEFAULT_MESSAGE#${{ inputs.message }}#" task_b/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./task_b
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}

  test:
    name: Test container
    runs-on: ubuntu-latest
    needs: docker

    services:
      web:
        image: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
        ports:
          - 8080:80

    steps:
      - name: Wait for container
        run: sleep 5

      - name: Fetch index.html
        run: curl http://127.0.0.1:8080/index.html
